<!-- Overlay -->
<div class="notif-overlay" id="notifOverlay" aria-hidden="true"></div>

<!-- Modal -->
<aside class="notif-modal" id="notifModal" role="dialog" aria-modal="true" aria-label="Notificações">

  <!-- Handle / Botão fechar -->
  <div class="notif-handle" id="notifClose" aria-label="Fechar notificações">
    <svg class="notif-arrow" viewBox="0 0 40 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 4L20 20L38 4" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>



  <!-- Cabeçalho -->
  <header class="notif-header">
    <div class="notif-header-left">
      <h2 class="notif-title">Novidades</h2>
      <span class="notif-subtitle">do seu bairro</span>
    </div>
  </header>

  <!-- Lista — preenchida dinamicamente pelo notification_modal.js -->
  <ul class="notif-list" id="notifList" role="list"></ul>

  <!-- Rodapé -->
<footer class="notif-footer">
  <button class="notif-mark-read" id="notifMarkAll">Marcar como visto</button>
  <button class="notif-see-all">Todas as notificações</button>
</footer>

</aside>
